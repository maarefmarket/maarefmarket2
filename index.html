<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusKart — متجر الجامعة</title>
<meta name="description" content="CampusKart — متجر جامعة المعارف للعلوم التطبيقية. شيبسات، مشروبات، بسكوت، معلبات، مثلجات، موالح، أدوات مدرسية. أسعار بالدولار والتركي والسوري. اطلب عبر واتساب." />
<meta name="theme-color" content="#2B5FB3" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header">
  <div class="container bar">
    <button class="logo" id="logoBtn" aria-label="الرئيسية">
      <img src="assets/logo.svg" alt="">
      <span id="logoText">CampusKart<b>.</b></span>
    </button>
    <div class="search" role="search">
      <input id="searchInput" type="search" placeholder="ابحث عن منتج..." aria-label="بحث" maxlength="80" autocomplete="off" />
      <span class="ic" aria-hidden="true">🔍</span>
    </div>
    <button class="icon-btn" id="cartBtn" aria-label="السلة">
      🛒<span class="cart-count" id="cartCount" style="display:none">0</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي">🌙</button>
  </div>
  <nav class="container" style="padding:0" aria-label="الأقسام"><div id="chipBar" class="chipbar"></div></nav>
</header>

<main class="container" id="app">
  <div class="loading"><span>جاري تحميل المتجر</span><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
</main>

<footer id="site-footer">
  <div class="container foot" id="foot"></div>
  <div class="copy" id="copy"></div>
</footer>

<dialog id="imageViewer" class="image-viewer" aria-labelledby="viewerTitle">
  <div class="viewer-header"><h2 id="viewerTitle"></h2><button type="button" id="viewerClose" aria-label="إغلاق">×</button></div>
  <div class="viewer-stage">
    <img id="viewerImage" alt="">
    <button type="button" id="viewerPrev" class="viewer-nav viewer-prev" aria-label="الصورة السابقة">›</button>
    <button type="button" id="viewerNext" class="viewer-nav viewer-next" aria-label="الصورة التالية">‹</button>
  </div>
  <div class="viewer-footer"><span id="viewerCount" aria-live="polite" dir="ltr"></span><a id="viewerLink" class="btn btn-outline" target="_blank" rel="noopener noreferrer" hidden>فتح رابط الإعلان</a><button type="button" id="viewerProduct" class="btn btn-primary" hidden>تفاصيل المنتج</button></div>
</dialog>
<dialog id="feedbackDialog" class="feedback-dialog" aria-labelledby="feedbackTitle">
  <form id="feedbackForm">
    <div class="feedback-head"><span aria-hidden="true">💬</span><h2 id="feedbackTitle">رأيك يساعدنا على التطوير</h2></div>
    <p>هل واجهتك مشكلة أثناء تصفح المتجر؟ هل لديك اقتراح لتحسينه؟</p>
    <p class="feedback-privacy">رأيك اختياري ومجهول الاسم. نحفظ نص الرأي والمنتجات المحددة وتاريخ الإرسال فقط في سجل الإدارة. لا تكتب اسمك أو رقم هاتفك أو أي معلومات شخصية.</p>
    <label class="label" for="feedbackText">ملاحظتك أو اقتراحك</label>
    <textarea class="field" id="feedbackText" rows="4" maxlength="1500" placeholder="اكتب رأيك هنا..."></textarea>
    <div id="feedbackError" class="err-msg" role="status" aria-live="polite"></div>
    <div class="feedback-actions">
      <button id="feedbackSend" class="btn btn-primary" type="submit">إرسال الاقتراح والمتابعة</button>
      <button id="feedbackSkip" class="btn btn-outline" type="button">تخطي والطلب عبر واتساب</button>
    </div>
  </form>
</dialog>
<script type="module" src="js/store.js"></script>
</body>
</html>
