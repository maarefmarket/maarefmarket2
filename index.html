<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusKart — متجر الجامعة</title>
<meta name="description" content="CampusKart — متجر جامعة المعارف للعلوم التطبيقية. شيبسات، مشروبات، بسكوت، معلبات، مثلجات، موالح، أدوات مدرسية. أسعار بالدولار والتركي والسوري. اطلب عبر واتساب." />
<meta name="theme-color" content="#2B5FB3" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/support.css">
<link rel="manifest" href="support.webmanifest">
</head>
<body>

<header id="site-header">
  <div class="container bar">
    <button class="logo" id="logoBtn" aria-label="الرئيسية">
      <img src="assets/logo.svg" alt="">
      <span id="logoText">CampusKart<b>.</b></span>
    </button>
    <div class="search" role="search">
      <input id="searchInput" type="search" placeholder="ابحث عن منتج..." aria-label="بحث" maxlength="80" autocomplete="off" />
      <span class="ic" aria-hidden="true">🔍</span>
      <button type="button" id="clearSearch" class="clear-search" aria-label="مسح البحث" hidden>×</button>
    </div>
    <button type="button" id="supportInboxBtn" class="icon-btn support-inbox-btn" aria-label="رسائلي" title="رسائلي" aria-haspopup="dialog" aria-controls="supportDialog" hidden><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><span class="support-inbox-label" aria-hidden="true">رسائلي</span><b id="supportUnread" class="support-unread" aria-label="محادثات فيها ردود جديدة" hidden></b></button>
    <button class="icon-btn" id="cartBtn" aria-label="السلة">
      🛒<span class="cart-count" id="cartCount" style="display:none">0</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي">🌙</button>
  </div>
  <nav class="container" style="padding:0" aria-label="الأقسام"><div id="chipBar" class="chipbar"></div></nav>
</header>

<main class="container" id="app">
  <div class="loading" role="status">جاري تحميل المتجر…</div>
  <div class="skeleton-banner" aria-hidden="true"></div>
  <div class="grid skeleton-grid" aria-hidden="true"><div class="skeleton-card"><div></div><i></i><i></i><i></i></div><div class="skeleton-card"><div></div><i></i><i></i><i></i></div><div class="skeleton-card"><div></div><i></i><i></i><i></i></div><div class="skeleton-card"><div></div><i></i><i></i><i></i></div><div class="skeleton-card"><div></div><i></i><i></i><i></i></div><div class="skeleton-card"><div></div><i></i><i></i><i></i></div><div class="skeleton-card"><div></div><i></i><i></i><i></i></div><div class="skeleton-card"><div></div><i></i><i></i><i></i></div></div>
</main>

<div id="shopDock" class="shop-dock" hidden>
  <div class="feedback-float-row"><button type="button" id="generalFeedbackBtn" class="general-feedback-btn" aria-haspopup="dialog" aria-controls="feedbackDialog" disabled><span aria-hidden="true">💬</span> رأيك يهمنا</button></div>
  <div id="cartSummary" class="cart-summary" hidden>
    <div class="summary-info"><strong id="summaryCount"></strong><span id="summaryTotal" dir="auto"></span></div>
    <button class="btn btn-outline" type="button" data-nav="cart">السلة</button>
    <button class="btn btn-wa" type="button" id="dockCheckout">📲 اطلب</button>
  </div>
  <nav class="mobile-nav" aria-label="التنقل السريع">
    <button type="button" data-nav="" data-dock="home"><span aria-hidden="true">⌂</span>الرئيسية</button>
    <button type="button" id="dockCategories" data-dock="categories"><span aria-hidden="true">▦</span>الأقسام</button>
    <button type="button" id="dockSearch" data-dock="search"><span aria-hidden="true">⌕</span>البحث</button>
    <button type="button" data-nav="cart" data-dock="cart"><span aria-hidden="true">🛒</span>السلة <b id="dockCount" hidden></b></button>
  </nav>
</div>
<dialog id="categoryDialog" class="category-dialog" aria-labelledby="categoryTitle">
  <div class="category-head"><h2 id="categoryTitle">تصفّح الأقسام</h2><button type="button" id="categoryClose" aria-label="إغلاق">×</button></div>
  <div id="categoryChoices" class="category-choices"></div>
</dialog>
<footer id="site-footer">
  <div class="container foot" id="foot"></div>
  <div class="copy" id="copy"></div>
</footer>

<dialog id="imageViewer" class="image-viewer" aria-labelledby="viewerTitle">
  <div class="viewer-header"><h2 id="viewerTitle"></h2><button type="button" id="viewerClose" aria-label="إغلاق">×</button></div>
  <div class="viewer-stage">
    <img id="viewerImage" alt="">
    <button type="button" id="viewerPrev" class="viewer-nav viewer-prev" aria-label="الصورة السابقة">›</button>
    <button type="button" id="viewerNext" class="viewer-nav viewer-next" aria-label="الصورة التالية">‹</button>
  </div>
  <div class="viewer-footer"><span id="viewerCount" aria-live="polite" dir="ltr"></span><a id="viewerLink" class="btn btn-outline" target="_blank" rel="noopener noreferrer" hidden>فتح رابط الإعلان</a><button type="button" id="viewerProduct" class="btn btn-primary" hidden>تفاصيل المنتج</button></div>
</dialog>
<dialog id="feedbackDialog" class="feedback-dialog" aria-labelledby="feedbackTitle">
  <form id="feedbackForm">
    <div class="feedback-head"><span aria-hidden="true">💬</span><h2 id="feedbackTitle">رأيك يساعدنا على التطوير</h2><button type="button" id="feedbackClose" class="feedback-close" aria-label="إغلاق والعودة لتعديل الطلب" title="العودة لتعديل الطلب">×</button></div>
    <p>هل واجهتك مشكلة أثناء تصفح المتجر؟ هل لديك اقتراح لتحسينه؟</p>
    <p class="feedback-privacy">رأيك اختياري ومجهول الاسم.</p>
    <div id="supportTypeRow" hidden><label class="label" for="supportType">نوع الرسالة</label><select id="supportType" class="support-input"><option value="suggestion">اقتراح</option><option value="complaint">شكوى</option><option value="question">استفسار</option></select></div>
    <label class="label" for="feedbackText">ملاحظتك أو اقتراحك</label>
    <textarea class="field" id="feedbackText" rows="4" maxlength="1500" placeholder="اكتب رأيك هنا..."></textarea>
    <div id="feedbackError" class="err-msg" role="status" aria-live="polite"></div>
    <div class="feedback-actions">
      <button id="feedbackSend" class="btn btn-primary" type="submit">إرسال الاقتراح والمتابعة</button>
      <button id="feedbackSkip" class="btn btn-outline" type="button">تخطي والطلب عبر واتساب</button>
    </div>
  </form>
</dialog>
<dialog id="supportDialog" class="feedback-dialog" aria-labelledby="supportTitle"><div class="feedback-head"><span aria-hidden="true">💬</span><h2 id="supportTitle">رأيك يهمنا — رسائلي</h2><button id="supportClose" type="button" class="feedback-close" aria-label="إغلاق">×</button></div><p class="feedback-privacy">مراسلات دون تسجيل اسم أو هاتف. يمكنك متابعة رسائلك من هذا المتصفح.</p><div id="supportStatus" role="status" aria-live="polite"></div><div id="supportContent" class="support-content"></div></dialog>
<script type="module" src="js/store.js"></script>
<script type="module" src="js/support.js"></script>
</body>
</html>
