<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusKart — متجر الجامعة</title>
<meta name="description" content="CampusKart — متجر جامعة المعارف للعلوم التطبيقية. شيبسات، مشروبات، بسكوت، معلبات، مثلجات، موالح، أدوات مدرسية. أسعار بالدولار والتركي والسوري. اطلب عبر واتساب." />
<meta name="theme-color" content="#2B5FB3" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header">
  <div class="container bar">
    <button class="logo" id="logoBtn" aria-label="الرئيسية">
      <img src="assets/logo.svg" alt="">
      <span id="logoText">CampusKart<b>.</b></span>
    </button>
    <div class="search" role="search">
      <input id="searchInput" type="search" placeholder="ابحث عن منتج..." aria-label="بحث" maxlength="80" autocomplete="off" />
      <span class="ic" aria-hidden="true">🔍</span>
    </div>
    <button class="icon-btn" id="cartBtn" aria-label="السلة">
      🛒<span class="cart-count" id="cartCount" style="display:none">0</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي">🌙</button>
  </div>
  <nav class="container" style="padding:0" aria-label="الأقسام"><div id="chipBar" class="chipbar"></div></nav>
</header>

<main class="container" id="app">
  <div class="loading"><span>جاري تحميل المتجر</span><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
</main>

<footer id="site-footer">
  <div class="container foot" id="foot"></div>
  <div class="copy" id="copy"></div>
</footer>

<script src="js/store.js"></script>
<script src="https://www.genspark.ai/sandbox_inspect.js"></script></body>
</html>
